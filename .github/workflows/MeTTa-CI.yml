name: MeTTaLog CI

on:
  push:
    branches:
      - main
      - dev
      - ref/*
      - reduct-refactoring
  pull_request:
    branches:
      - main
      - dev
      - ref/*
      - reduct-refactoring

jobs:
  setup-and-test:
    runs-on: ubuntu-latest
    container:
      image: indominyus/mettalog:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # - name: Run mettalog test
      #   run: |
      #     pip3 install ansi2html
      #     python3 scripts/run-tests.py

      - name: Run expand-demes mettalog
        run: |
          if command -v mettalog >/dev/null 2>&1; then
            mettalog metta-moses/deme/tests/expand-demes-test.metta
          else
            echo "mettalog not found in container"
            exit 1
          fi
